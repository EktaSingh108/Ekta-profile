<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cinemaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="50%" stop-color="#16233B" />
      <stop offset="100%" stop-color="#1B2942" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <radialGradient id="projectorLight" cx="0%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#6C8FE6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6C8FE6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#111C32" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cinema Canvas -->
  <rect width="480" height="320" fill="url(#cinemaBg)" rx="12"/>

  <!-- Projector Beam Cone -->
  <polygon points="40,160 480,40 480,280" fill="url(#projectorLight)"/>

  <!-- 35mm Celluloid Film Strip (Flowing S-Curve) -->
  <g opacity="0.85">
    <path d="M -20 80 C 140 30 180 240 320 180 C 400 145 460 210 500 240" fill="none" stroke="#263D66" stroke-width="56"/>
    <path d="M -20 80 C 140 30 180 240 320 180 C 400 145 460 210 500 240" fill="none" stroke="#111C32" stroke-width="48"/>
    
    <!-- Sprocket Holes Top/Bottom -->
    <path d="M -20 60 C 140 10 180 220 320 160 C 400 125 460 190 500 220" fill="none" stroke="#6C8FE6" stroke-width="4" stroke-dasharray="7,9"/>
    <path d="M -20 100 C 140 50 180 260 320 200 C 400 165 460 230 500 260" fill="none" stroke="#6C8FE6" stroke-width="4" stroke-dasharray="7,9"/>
  </g>

  <!-- Director's Clapperboard (Foreground) -->
  <g transform="translate(180, 100) rotate(-8)">
    <!-- Clapperboard Body -->
    <rect x="0" y="36" width="170" height="120" rx="6" fill="#111C32" stroke="#6C8FE6" stroke-width="2"/>
    
    <!-- Clapper Hinged Top Stick (Open) -->
    <g transform="translate(0, 36) rotate(-18)">
      <rect x="0" y="-24" width="170" height="24" rx="3" fill="#111C32" stroke="#6C8FE6" stroke-width="1.5"/>
      <!-- Diagonal Zebra Stripes -->
      <polygon points="12,-24 28,-24 16,0 0,0" fill="#FFFFFF"/>
      <polygon points="46,-24 62,-24 50,0 34,0" fill="#FFFFFF"/>
      <polygon points="80,-24 96,-24 84,0 68,0" fill="#FFFFFF"/>
      <polygon points="114,-24 130,-24 118,0 102,0" fill="#FFFFFF"/>
      <polygon points="148,-24 164,-24 152,0 136,0" fill="#FFFFFF"/>
    </g>

    <!-- Lower Stick Fixed Stripes -->
    <rect x="0" y="36" width="170" height="20" fill="#1B2942" stroke="#6C8FE6" stroke-width="1.2"/>
    <polygon points="20,36 36,36 24,56 8,56" fill="#FFFFFF"/>
    <polygon points="54,36 70,36 58,56 42,56" fill="#FFFFFF"/>
    <polygon points="88,36 104,36 92,56 76,56" fill="#FFFFFF"/>
    <polygon points="122,36 138,36 126,56 110,56" fill="#FFFFFF"/>
    <polygon points="156,36 168,36 160,56 144,56" fill="#FFFFFF"/>

    <!-- Clapperboard Production Chalk Text -->
    <text x="14" y="78" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#6C8FE6" letter-spacing="1">SCENE</text>
    <text x="14" y="98" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#FFFFFF">01</text>
    
    <text x="75" y="78" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#6C8FE6" letter-spacing="1">TAKE</text>
    <text x="75" y="98" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#FFFFFF">24</text>

    <text x="125" y="78" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#6C8FE6" letter-spacing="1">FPS</text>
    <text x="125" y="98" font-family="'Playfair Display', serif" font-size="14" font-weight="700" fill="#FFFFFF">24p</text>

    <line x1="12" y1="114" x2="158" y2="114" stroke="#263D66" stroke-width="1"/>
    
    <text x="14" y="132" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#B9C8E4" letter-spacing="0.5">DIRECTOR: EKTA SINGH</text>
    <text x="14" y="146" font-family="'Inter', sans-serif" font-size="7.5" fill="#6C8FE6">GENRE: CINEMATIC STORIES</text>
  </g>

  <!-- Classic Film Canister / Reel (Bottom Left) -->
  <g transform="translate(60, 210)">
    <circle cx="28" cy="28" r="34" fill="#1B2942" stroke="#6C8FE6" stroke-width="2"/>
    <circle cx="28" cy="28" r="22" fill="#111C32" stroke="#263D66" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="8" fill="#6C8FE6"/>
    <!-- Cutouts -->
    <circle cx="28" cy="12" r="5" fill="#263D66"/>
    <circle cx="28" cy="44" r="5" fill="#263D66"/>
    <circle cx="12" cy="28" r="5" fill="#263D66"/>
    <circle cx="44" cy="28" r="5" fill="#263D66"/>
  </g>

  <!-- Editorial Badge -->
  <rect x="330" y="20" width="130" height="26" rx="13" fill="#111C32" stroke="#6C8FE6" stroke-width="1"/>
  <text x="395" y="37" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#B9C8E4" text-anchor="middle" letter-spacing="1.5">CINEMA · PERSPECTIVE</text>
</svg>